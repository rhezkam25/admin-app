name: admin-app

services:
  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "${VLAN_IP:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    depends_on:
      - app
    networks:
      - frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      retries: 3

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    env_file:
      - .env
    environment:
      RUN_MIGRATIONS: "true"
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend
      - backend
    restart: unless-stopped

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    env_file:
      - .env
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      - app
      - db
    networks:
      - backend
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php artisan schedule:work
    env_file:
      - .env
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      - app
      - db
    networks:
      - backend
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-admin_app}"
      MYSQL_USER: "${DB_USERNAME:-admin_app}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-ubah-password-ini}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-ubah-root-password-ini}"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/app.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-ubah-root-password-ini}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - backend
    restart: unless-stopped

volumes:
  db_data:
  app_storage:

networks:
  frontend:
  backend:
    internal: true
