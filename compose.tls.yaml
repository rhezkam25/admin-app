services:
  web:
    ports:
      - "${VLAN_IP:-127.0.0.1}:443:443"
    volumes:
      - ./docker/nginx/default.ssl.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "-", "https://127.0.0.1/up"]
